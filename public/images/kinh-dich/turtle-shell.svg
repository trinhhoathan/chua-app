<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="shellBody" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#c4a574"/>
      <stop offset="45%" stop-color="#8b6914"/>
      <stop offset="100%" stop-color="#4a3410"/>
    </radialGradient>
    <radialGradient id="shellRim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#5c4030" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a1a0c" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="shellHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d5a8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e8d5a8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- outer oval shell -->
  <ellipse cx="160" cy="148" rx="142" ry="118" fill="url(#shellBody)"/>
  <ellipse cx="160" cy="148" rx="142" ry="118" fill="url(#shellRim)"/>
  <!-- scute pattern -->
  <path d="M160 48 L210 88 L210 148 L160 188 L110 148 L110 88 Z" fill="#6b4e1e" opacity="0.35" stroke="#3d2a12" stroke-width="1.5"/>
  <path d="M110 88 L160 48 L210 88" fill="none" stroke="#2a1a0c" stroke-width="1.2" opacity="0.5"/>
  <path d="M110 88 L110 148 L160 188" fill="none" stroke="#2a1a0c" stroke-width="1.2" opacity="0.5"/>
  <path d="M210 88 L210 148 L160 188" fill="none" stroke="#2a1a0c" stroke-width="1.2" opacity="0.5"/>
  <!-- side scutes -->
  <path d="M48 120 Q80 70 110 88 L110 148 Q70 160 48 120 Z" fill="#7a5a22" opacity="0.4" stroke="#3d2a12" stroke-width="1"/>
  <path d="M272 120 Q240 70 210 88 L210 148 Q250 160 272 120 Z" fill="#7a5a22" opacity="0.4" stroke="#3d2a12" stroke-width="1"/>
  <path d="M70 200 Q100 230 160 228 Q220 230 250 200 L210 148 L160 188 L110 148 Z" fill="#5c4218" opacity="0.35" stroke="#3d2a12" stroke-width="1"/>
  <!-- inner casting bowl (plastron hollow) -->
  <ellipse cx="160" cy="142" rx="78" ry="58" fill="#1a1208" opacity="0.55"/>
  <ellipse cx="160" cy="138" rx="70" ry="50" fill="#2c2114"/>
  <ellipse cx="160" cy="132" rx="62" ry="42" fill="#3a2c1a" opacity="0.9"/>
  <!-- soft highlight -->
  <ellipse cx="130" cy="100" rx="50" ry="28" fill="url(#shellHighlight)"/>
  <!-- head hint -->
  <ellipse cx="160" cy="42" rx="18" ry="14" fill="#6b5330"/>
  <ellipse cx="160" cy="40" rx="12" ry="9" fill="#8a6b3e"/>
</svg>
